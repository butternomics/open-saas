[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "butter-comment-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30,<1",
    "sqlmodel>=0.0.24,<0.1",
    "alembic>=1.13,<2",
    "apscheduler>=3.11,<4",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "ollama>=0.6,<1",
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.5",
]

[project.scripts]
butter-comment-assistant = "butter_comment_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
butter_comment_assistant = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
